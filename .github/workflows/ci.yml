name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and route tests
        run: npm test

      # Hosting runtimes may not allow require() of ES modules (Vercel failed with
      # ERR_REQUIRE_ESM from jwks-rsa -> jose 6). Load the server's Firebase
      # modules with that feature disabled so such a dependency fails here first.
      - name: Server modules load without require(esm)
        run: node --no-experimental-require-module -e "require('firebase-admin/app'); require('firebase-admin/auth'); require('firebase-admin/firestore'); require('web-push')"

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Fails on high or critical advisories in shipped dependencies. The remaining
      # moderate ones are transitive deps of firebase-admin awaiting an upstream fix.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Informational: includes dev tooling (vitest, postcss...), which the gate
      # above skips. Review the output; it does not fail the build.
      - name: Audit all dependencies (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true
